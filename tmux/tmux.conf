# ─── Shell ────────────────────────────────────────────────
set -g default-shell /opt/homebrew/bin/fish
set -g default-command /opt/homebrew/bin/fish

# ─── Prefix ───────────────────────────────────────────────
# Keep C-b as prefix (uncomment next two lines to use C-a instead)
# unbind C-b
# set -g prefix C-a

# ─── General ──────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -as terminal-features ",xterm-ghostty:clipboard"

# ─── Devcontainer (tmux-devcontainers plugin) ───────────
# prefix + E  → open login shell in devcontainer (plugin default)
# prefix + D  → same (alias, bound after TPM init)
# prefix + C-e → devcontainer menu

# ─── Smart window names ──────────────────────────────────
set -g automatic-rename on
set -g automatic-rename-format '#(~/.tmux/smart-name.sh #{pane_pid} #{pane_current_path} #{pane_current_command} #{pane_tty})'

# ─── Vim-style pane navigation ────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + hjkl pane switching (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ─── Vim-style pane resizing ──────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Vim-style window (tab) switching ─────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Shift-arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# ─── Intuitive splits (in current path) ──────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ─── Copy mode (vim-style) ───────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ─── Quick reload ─────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ─── Status bar (Catppuccin Mocha — matches starship) ────
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Colors — Catppuccin Mocha palette
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Left: session name with powerline arrow
set -g status-left-length 40
set -g status-left "#[bg=#f38ba8,fg=#1e1e2e,bold]  #S #[fg=#f38ba8,bg=#1e1e2e] "

# Window tabs — powerline style matching starship's arrow segments
set -g window-status-format "#[fg=#1e1e2e,bg=#313244]#[fg=#6c7086,bg=#313244] #I:#W #[fg=#313244,bg=#1e1e2e]"
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa]#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W #{?window_zoomed_flag,󰊓 ,}#[fg=#89b4fa,bg=#1e1e2e]"
set -g window-status-separator " "

# Right: git branch + path + time (matches starship segments)
set -g status-right-length 120
set -g status-right "\
#[fg=#a6e3a1,bg=#1e1e2e]#{devcontainers_workspace} #{devcontainers_status} \
#[fg=#f9e2af,bg=#1e1e2e]#[fg=#1e1e2e,bg=#f9e2af,bold] #(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '—') \
#[fg=#fab387,bg=#f9e2af]#[fg=#1e1e2e,bg=#fab387]  #(~/.tmux/folder-label.sh #{pane_pid} #{pane_current_path}) \
#[fg=#f38ba8,bg=#fab387]#[fg=#1e1e2e,bg=#f38ba8,bold]  %H:%M "

# Window activity
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=#f9e2af"

# ─── Plugins ────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'phil/tmux-devcontainers'

set -g @continuum-restore 'on'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Post-plugin: alias prefix+D to the same devcontainer exec command
bind D run -b '~/.tmux/plugins/tmux-devcontainers/scripts/commands.sh run_exec_in_window'
